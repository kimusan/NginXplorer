<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Background stats bars -->
  <rect x="80" y="310" width="44" height="110" rx="8" fill="#3b82f6" opacity="0.3"/>
  <rect x="140" y="250" width="44" height="170" rx="8" fill="#3b82f6" opacity="0.4"/>
  <rect x="200" y="280" width="44" height="140" rx="8" fill="#3b82f6" opacity="0.35"/>
  <rect x="260" y="200" width="44" height="220" rx="8" fill="#10b981" opacity="0.5"/>
  <rect x="320" y="160" width="44" height="260" rx="8" fill="#10b981" opacity="0.6"/>
  <rect x="380" y="230" width="44" height="190" rx="8" fill="#06b6d4" opacity="0.45"/>

  <!-- Pulse waveform line -->
  <path d="M 64 340 L 140 280 L 200 320 L 260 210 L 330 150 L 390 220 L 448 180" 
        fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Data point nodes -->
  <circle cx="260" cy="210" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="330" cy="150" r="12" fill="#06b6d4" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="390" cy="220" r="9" fill="#10b981" stroke="#ffffff" stroke-width="3"/>

  <!-- Stylized "N" badge in top-left -->
  <g transform="translate(80, 72) scale(0.65)">
    <polygon points="0,0 36,0 100,110 100,0 136,0 136,140 100,140 36,30 36,140 0,140" fill="url(#accentGrad)" />
  </g>
</svg>
