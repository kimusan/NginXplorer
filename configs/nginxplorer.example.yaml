# NginXplorer Configuration
# Copy this to /etc/nginxplorer/config.yaml or ~/.config/nginxplorer/config.yaml

server:
  # Address to bind the web dashboard
  bind: "127.0.0.1:9100"
  # Set to 0.0.0.0:9100 to expose remotely (requires auth)

auth:
  # Enable authentication (required when bind is not localhost)
  enabled: true
  # Username and password for web dashboard login
  # Password is stored as bcrypt hash. Generate with:
  #   nginxplorer hash-password
  users:
    - username: admin
      # Default password: 'changeme' — CHANGE THIS!
      password_hash: "$2a$10$K0E.nADuD0f39ELn1mV72uq75kL8whLrKex0g4Q9lE4CuRSRLpXQ2"

nginx:
  # stub_status URL (usually on localhost)
  stub_status_url: "http://127.0.0.1:8099/nginx_status"
  # How often to poll stub_status (milliseconds)
  stub_status_interval: 500
  
  # VTS module status URL (optional, leave empty to disable)
  vts_status_url: ""
  
  # Unix socket to receive JSON access logs from Nginx syslog
  log_socket: "/var/run/nginxplorer.sock"
  # Alternative: path to access log file to tail
  # log_file: "/var/log/nginx/access.log"

storage:
  # Path to SQLite database for historical data
  db_path: "/var/lib/nginxplorer/data.db"
  # Retention: how many days of historical data to keep
  retention_days: 30

metrics:
  # Maximum number of vhosts to track (memory sizing)
  max_vhosts: 50
  # Maximum number of top paths to track per vhost
  max_top_paths: 100
  # Maximum number of unique visitors window (minutes)
  visitor_window_minutes: 5

# Privacy settings
privacy:
  # Anonymize IP addresses (mask last octet)
  anonymize_ips: false
  # Don't log query strings
  strip_query_strings: true

# Ingestion filtering (exclude self-monitoring and unwanted traffic from metrics)
filter:
  # List of virtual hosts to ignore (e.g. self-monitoring dashboard host)
  ignore_hosts:
    - "stats.dublin.hackspace.tech"
  # List of URI prefixes to ignore
  ignore_paths:
    # - "/api/v1/"
    # - "/healthz"

# Geo-Location Settings
geoip:
  # Enable country resolution and top countries metrics
  enabled: true
  # Path to local MaxMind / DB-IP Country .mmdb database
  db_path: "/var/lib/nginxplorer/geoip-country.mmdb"
  # Automatically download and refresh DB-IP Country Lite (CC BY 4.0, zero key needed)
  auto_download: true

# Alerting and Webhook Notifications
alerts:
  enabled: false
  # Click-through URL included in alert notifications
  dashboard_url: "https://stats.dublin.hackspace.tech"
  # Minimum cooldown between repeat firings of the same alert
  cooldown: "10m"
  rules:
    # High error rate rule with low-traffic noise protection
    - name: "High Error Rate"
      vhost: "all"            # "all" or specific vhost name (e.g. "example.com")
      metric: "error_rate"    # error_rate (%), latency_p95 (ms), latency_avg (ms), zero_traffic (rps)
      threshold: 5.0          # error rate > 5.0%
      duration: "1m"          # must persist for at least 1 minute
      min_requests: 20        # require at least 20 total requests in window (prevents 1-2 bot scan false positives)
      min_errors: 5           # require at least 5 errors

    - name: "High Latency"
      vhost: "all"
      metric: "latency_p95"
      threshold: 1500.0       # p95 latency > 1500ms
      duration: "2m"
      min_requests: 10

  channels:
    # ntfy.sh push notifications (mobile app & web)
    - type: "ntfy"
      url: "https://ntfy.sh/nginxplorer_alert"
      # token: ""             # optional bearer token if topic is protected

    # Pushbullet notifications (Android, iOS, Chrome, desktop)
    # - type: "pushbullet"
    #   api_token: "o.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    #   device_iden: ""       # optional device ID to target specific device

    # Slack, Discord, or Mattermost incoming webhooks
    # - type: "slack"
    #   url: "https://hooks.slack.com/services/..."
    # - type: "discord"
    #   url: "https://discord.com/api/webhooks/..."

    # Generic HTTP webhook
    # - type: "webhook"
    #   url: "https://api.example.com/alerts"
    #   token: "secret"

# Logging
log:
  level: "info"  # debug, info, warn, error
  format: "text"  # text or json

