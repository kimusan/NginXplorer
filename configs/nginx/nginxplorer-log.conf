# NginXplorer — Structured JSON Log Format
# Include this in your nginx.conf http {} block
#
# Usage:
#   http {
#       include /etc/nginx/conf.d/nginxplorer-log.conf;
#   }

# Structured JSON log format for NginXplorer
log_format nginxplorer escape=json '{'
    '"ts":"$time_iso8601",'
    '"host":"$server_name",'
    '"addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"bytes":$bytes_sent,'
    '"body_bytes":$body_bytes_sent,'
    '"req_len":$request_length,'
    '"req_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"ua":"$http_user_agent",'
    '"ref":"$http_referer",'
    '"ssl_proto":"$ssl_protocol",'
    '"conn":"$connection",'
    '"conn_reqs":"$connection_requests"'
'}';

# Stream logs to NginXplorer via Unix domain socket
# This is the recommended approach (zero disk I/O overhead)
access_log syslog:server=unix:/var/run/nginxplorer.sock,tag=nginx nginxplorer;

# IMPORTANT: Keep your existing access_log directive!
# The above line is additive — your normal logs continue to work.

# Alternative: log to a file that NginXplorer tails
# access_log /var/log/nginx/nginxplorer.log nginxplorer buffer=64k flush=5s;
