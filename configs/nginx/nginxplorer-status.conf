# NginXplorer — Status Endpoints
# Include this as a separate server block
#
# Usage:
#   include /etc/nginx/conf.d/nginxplorer-status.conf;

# Internal-only server for status endpoints
server {
    listen 127.0.0.1:8099;
    server_name 127.0.0.1;

    # Basic stub_status (always available in open-source Nginx)
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    # VTS module status (if nginx-module-vts is installed)
    # Uncomment the block below if you have VTS compiled/loaded
    #
    # location /vts_status {
    #     vhost_traffic_status_display;
    #     vhost_traffic_status_display_format json;
    #     allow 127.0.0.1;
    #     deny all;
    #     access_log off;
    # }
}

# If using VTS module, add this to your http {} block:
# vhost_traffic_status_zone;
#
# This automatically tracks per-vhost metrics for all server blocks.
# Memory usage: ~10MB shared memory (configurable)
